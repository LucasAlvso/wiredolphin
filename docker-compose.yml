services:
  wiredolphin:
    image: wiredolphin:latest
    build: .
    container_name: wiredolphin
    restart: unless-stopped
    # Use a dedicated bridge so the server can see client bridge traffic
    privileged: true

    # Capabilities needed to create tun interface, iptables, open raw sockets
    # and load kernel modules if required
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE

    # Enable IP forwarding sysctl inside the container (compose can apply this on bridge networks)
    sysctls:
      net.ipv4.ip_forward: '1'

    # Access to /dev/net/tun from host
    devices:
      - "/dev/net/tun:/dev/net/tun"

    # IP forwarding will be attempted in entrypoint and should also be enabled
    # via the container sysctl above.

    # Persist CSV logs and provide tunnel binary/source
    working_dir: /logs
    volumes:
      - ./logs:/logs

    environment:
      - IFACE=tun0
      - TUN_UNDERLAY_IF=eth0
      - TUN_START=true
      - TUN_WAIT_TIMEOUT=20
      - TUN_ADDR_CIDR=172.31.66.1/24
      - TUN_ENABLE_NAT=true
      - TUN_GEN_TRAFFIC=true
    networks:
      wiredolphin_net:
        ipv4_address: 172.31.66.1

  client1:
    image: wiredolphin:latest
    depends_on:
      - wiredolphin
    container_name: wiredolphin-client1
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./traffic_tunnel:/client-config:ro
  # Attach to the same `wiredolphin_net` bridge so the server can ARP and
  # receive client underlay frames (needed for the tunnel/gateway to function).
    environment:
      - IFACE=tun0
      - CLIENT_UNDERLAY_IF=eth0
      - CLIENT_SCRIPT=/client-config/client1.sh
      - GEN_TRAFFIC=${TUN_GEN_TRAFFIC:-true}
      - GEN_DHCP=true
      - PING_TARGET=1.1.1.1
      - PING_COUNT=3
      - HTTP_URL=http://172.31.66.1/
      - DNS_NAME=example.com
      - DNS_SERVER=172.31.66.1
      - NTP_SERVER=pool.ntp.org
      - TUN_WAIT_TIMEOUT=20
    entrypoint: ["/entrypoint-client.sh"]
    networks:
      - wiredolphin_net

  client2:
    image: wiredolphin:latest
    depends_on:
      - wiredolphin
    container_name: wiredolphin-client2
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./traffic_tunnel:/client-config:ro
  # Attach to the same `wiredolphin_net` bridge so the server can ARP and
  # receive client underlay frames (needed for the tunnel/gateway to function).
    environment:
      - IFACE=tun0
      - CLIENT_UNDERLAY_IF=eth0
      - CLIENT_SCRIPT=/client-config/client2.sh
      - GEN_TRAFFIC=${TUN_GEN_TRAFFIC:-true}
      - GEN_DHCP=true
      - PING_TARGET=8.8.8.8
      - PING_COUNT=3
      - HTTP_URL=http://172.31.66.1/
      - DNS_NAME=cloudflare.com
      - DNS_SERVER=172.31.66.1
      - NTP_SERVER=time.google.com
      - TUN_WAIT_TIMEOUT=20
    entrypoint: ["/entrypoint-client.sh"]
    networks:
      - wiredolphin_net

networks:
  wiredolphin_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.66.0/24
          gateway: 172.31.66.254
